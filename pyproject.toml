[project]
name = "food11-pipeline"
version = "0.1.0"
description = "Food-11 training pipeline: ablations, HPO, distillation, INT8 quantization"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy",
  "pillow",
  "pandas",
  "matplotlib",
  "optuna",
  "pyyaml",
  "onnx",
  "onnxruntime",
  "onnxscript",
  "transformers>=4.50,<4.57",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f11"]
